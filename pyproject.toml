[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "greenwave-arterial-milp"
version = "1.0.0"
description = "Green/red wave arterial coordination MILP design-document implementation"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
highspy = ["highspy>=1.7"]

[tool.setuptools.packages.find]
include = ["greenwave*"]
